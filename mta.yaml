_schema-version: "3.3.0"
ID: sap_btp_cap
version: 1.0.0
description: "Incident Management - CAP on SAP BTP"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # --------------------- CAP Service (Node.js) ---------------------
  - name: sap_btp_cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sap_btp_cap-auth
      - name: sap_btp_cap-db

  # --------------------- HANA HDI Deployer ---------------------
  - name: sap_btp_cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sap_btp_cap-db

  # --------------------- Application Router ---------------------
  - name: sap_btp_cap
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sap_btp_cap-auth
      - name: sap_btp_cap-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  # --------------------- HTML5 App: Incidents UI ---------------------
  - name: incidents-ui
    type: html5
    path: app/incidents/webapp
    build-parameters:
      builder: custom
      commands:
        - npx --yes rimraf dist
        - node -e "require('fs').mkdirSync('dist',{recursive:true})"
        - npx --yes bestzip dist/incidents-ui.zip Component.js manifest.json xs-app.json index.html i18n
      build-result: dist
      supported-platforms: []

  # --------------------- HTML5 Apps Repo Content Deployer ---------------------
  - name: sap_btp_cap-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: sap_btp_cap-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - incidents-ui.zip
          name: incidents-ui
          target-path: resources/

resources:
  # --------------------- XSUAA ---------------------
  - name: sap_btp_cap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap_btp_cap-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  # --------------------- HANA Cloud HDI Container ---------------------
  - name: sap_btp_cap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # --------------------- HTML5 Apps Repo ---------------------
  - name: sap_btp_cap-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: sap_btp_cap-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # --------------------- Destination Service ---------------------
  - name: sap_btp_cap-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
